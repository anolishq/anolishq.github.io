name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test build scripts
        run: pnpm test

      - name: Build docs (includes dead-link validation)
        run: pnpm build
        env:
          # Authenticate downstream GitHub API/asset fetches to avoid the
          # unauthenticated rate limit. Missing release assets are non-fatal
          # on PR builds (GITHUB_EVENT_NAME=pull_request) — see fetch-metrics.mjs.
          GITHUB_TOKEN: ${{ github.token }}

  ok:
    name: ok
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - uses: anolishq/.github/.github/actions/require-needs-passed@2f08cae7f3b9bfaa817b822e256d9f66b1fdb18d # v2
        with:
          results: ${{ join(needs.*.result, ' ') }}
